

# ─────────────────────────────────────────────
# STARSHIP CONFIGURATION
# ─────────────────────────────────────────────

add_newline = false

format = """
[](#3b4252)\
$username\
[](bg:#434c5e fg:#3b4252)\
$hostname\
[](bg:#5e81ac fg:#434c5e)\
$directory\
[](bg:#4c566a fg:#5e81ac)\
$git_branch\
$git_status\
[](bg:#3b4252 fg:#4c566a)\
$cmd_duration\
[](#3b4252)\
$line_break\
$character"""

# ─────────────────────────────────────────────
# USERNAME
# ─────────────────────────────────────────────

[username]
show_always = true
style_user = "bg:#3b4252 fg:#f2f2f0 bold"
style_root = "bg:#3b4252 fg:#b98d99 bold"
format = "[ $user ]($style)"

# ─────────────────────────────────────────────
# HOSTNAME
# ─────────────────────────────────────────────

[hostname]
ssh_only = false
format = "[ $hostname ](bg:#434c5e fg:#f2f2f0 bold)"
style = "bg:#434c5e fg:#f2f2f0"

# ─────────────────────────────────────────────
# DIRECTORY
# ─────────────────────────────────────────────

[directory]
style = "bg:#5e81ac fg:#f2f2f0 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "bg:#5e81ac fg:#bf616a"

# ─────────────────────────────────────────────
# GIT BRANCH
# ─────────────────────────────────────────────

[git_branch]
symbol = " "
style = "bg:#4c566a fg:#a3be8c bold"
format = "[ $symbol$branch ]($style)"

# ─────────────────────────────────────────────
# GIT STATUS
# ─────────────────────────────────────────────

[git_status]
style = "bg:#4c566a fg:#ebcb8b bold"
format = "[$all_status$ahead_behind ]($style)"

conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ─────────────────────────────────────────────
# COMMAND DURATION
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bg:#3b4252 fg:#b68e73 bold"
format = "[  $duration ]($style)"

# ─────────────────────────────────────────────
# PROMPT SYMBOL
# ─────────────────────────────────────────────

[character]
success_symbol = "[❯](bold #a3be8c)"
error_symbol = "[❯](bold #bf616a)"
vimcmd_symbol = "[❮](bold #81a1c1)"
vimcmd_replace_one_symbol = "[❮](bold #b48ead)"
vimcmd_replace_symbol = "[❮](bold #b48ead)"
vimcmd_visual_symbol = "[❮](bold #ebcb8b)"

# ─────────────────────────────────────────────
# DISABLE UNUSED MODULES
# ─────────────────────────────────────────────

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

