# ==============================================================================
# MPD (Music Player Daemon) Configuration for Arch Linux
# ==============================================================================

# --- File & Directory Locations ----------------------------------------------
music_directory      "~/Music"
playlist_directory   "~/Music/mpd/playlists"
db_file              "~/Music/mpd/database"
state_file           "~/.config/mpd/state"
sticker_file         "~/.config/mpd/sticker.sql"

# --- Network & Daemon Settings -----------------------------------------------
# Bind to localhost so clients (like rmpc) can connect
bind_to_address      "127.0.0.1"
port                 "6600"

# Automatically create the database if it doesn't exist
auto_update          "yes"
auto_update_depth    "3"

# --- Audio Output (PipeWire / PulseAudio) ------------------------------------
# Arch Linux defaults to PipeWire. This output uses the PipeWire Pulse/ALSA plugin.
audio_output {
    type             "pulse"
    name             "PipeWire Sound Server"
    # server         "localhost"  # Uncomment if connecting to a remote server
}

# --- Alternative: ALSA Output (Uncomment if not using PipeWire/PulseAudio) ----
# audio_output {
#     type             "alsa"
#     name             "ALSA Sound Card"
#     # device         "hw:0,0"     # Optional: specify your hardware device
#     mixer_type       "software"   # Allows MPD to control volume independently
# }

# --- Visualizer / FIFO Output ------------------------------------------------
# Required if you want rmpc or other tools to display visualizers/spectrum analyzers
audio_output {
    type             "fifo"
    name             "Visualizer FIFO"
    path             "/tmp/mpd.fifo"
    format           "44100:16:2"
}

# --- Decoding & Behavior -----------------------------------------------------
# Normalization helps prevent sudden volume jumps between tracks
volume_normalization "no"
replaygain           "off"
